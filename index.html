            <circle cx="60" cy="60" r="54" fill="url(#centerIconGradient)" stroke="#805ad5" stroke-width="4"/>

            <circle cx="60" cy="60" r="18" fill="none" stroke="#805ad5" stroke-width="2"/>

            </text>
            <text x="50%" y="72%" dominant-baseline="middle" text-anchor="middle" fill="#805ad5"
                  font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="bold">AI

    </div>
<h2 id="initial-heading" class="center-heading animate-type">
What are you working on?

<p class="tagline">I'm here to help with your questions, coding, creative projects, and more.</p>
</div>
<div id="message-display" class="message-display"></div>

</button>

<span class="material-symbols-outlined">add_photo_alternate</span>

Add Image

</label>
</div>

Add File

</div>
</div>
</div>

<div id="file-previews-container" class="file-previews-container"></div>

</div>

<span class="material-symbols-outlined"> mic </span>
</button>

</div>

<div id="searchBoxOverlay" class="search-box-overlay">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>
window.addEventListener("DOMContentLoaded", () => {
fetchChatsOnLoad();
});


async function fetchChatsOnLoad() {
try {
const res = await fetch("http://localhost:8000/api/chats");
const chats = await res.json();


chats.forEach(chat => {
renderChat(chat.user_message, chat.ai_response);
});
} catch (err) {
console.error("❌ Error loading chats:", err);
}
}


function renderChat(userMsg, aiMsg) {
const container = document.getElementById("message-display");


const messageEl = document.createElement("div");
messageEl.classList.add("chat-pair");


messageEl.innerHTML = `
<div class="user-message">
<strong>You:</strong> ${userMsg}
</div>
<div class="ai-message">
<strong>Jarvis:</strong> ${aiMsg}
</div>
<hr />
`;


container.appendChild(messageEl);
}
</script>


<script src="/static/script.js"></script>
</body>
</html>
